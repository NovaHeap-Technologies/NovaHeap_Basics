sentence=Beginner's toolkit without delay(): repeating and one-shot timers, a debounced button with click and long press, and a Serial Monitor command menu.
paragraph=NHTimer runs something every so often and NHTimeout once after a while, both safe across the millis() rollover. NHButton filters bounce and noise and reports pressed, released, clicked and long-pressed. NHCommands turns typed lines like "blink 250" into calls to your own functions, with arguments and a built-in help list. No dynamic memory; runs on any board.
